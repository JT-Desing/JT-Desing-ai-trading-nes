name: NES Core and Agent Safety Tests
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore NesTrading.sln
      - name: Build
        run: dotnet build NesTrading.sln -c Release --no-restore
      - name: Test
        run: dotnet test NesTrading.sln -c Release --no-build --logger "console;verbosity=normal"
